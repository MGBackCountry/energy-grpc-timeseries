[project]
name = "grpc-timeseries"
version = "3.0.0"
description = "gRPC time-series service backed by Redis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.80",
    "grpcio-tools>=1.80",
    "protobuf>=6.31.1",
    "redis>=7.4.0",
    "watchfiles>=0.21.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]

[tool.uv]
constraint-dependencies = [
    "grpcio>=1.80",
    "grpcio-tools>=1.80",
]
package = true

[project.scripts]
grpc-timeseries = "grpc_timeseries.server:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -s"
pythonpath = ["src", "src/grpc_timeseries/generated"]
